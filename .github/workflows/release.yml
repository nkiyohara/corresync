name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-release:
    name: Verify and build draft release
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # Create the verified draft and upload its assets.
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a supported tag from its release line
        shell: bash
        run: |
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          preview='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc)\.(0|[1-9][0-9]*)$'
          if [[ "$GITHUB_REF_NAME" =~ $stable ]]; then
            channel=stable
          elif [[ "$GITHUB_REF_NAME" =~ $preview ]]; then
            channel=preview
          else
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            echo "Use vX.Y.Z or vX.Y.Z-{alpha,beta,rc}.N." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if [[ "$major" == "0" && "$minor" -lt 8 ]]; then
            echo "Release lines earlier than v0.8 are closed." >&2
            exit 1
          fi

          source_ref=refs/remotes/origin/main
          if [[ "$major.$minor" == "0.8" ]]; then
            source_ref=refs/remotes/origin/release/0.8
            if git show-ref --verify --quiet refs/tags/v0.9.0; then
              echo "The v0.8 release line closed when v0.9.0 became stable." >&2
              exit 1
            fi
          fi

          if ! git show-ref --verify --quiet "$source_ref"; then
            echo "Required release source is unavailable: $source_ref" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$source_ref"; then
            echo "$GITHUB_REF_NAME must identify a commit reachable from $source_ref" >&2
            exit 1
          fi

          echo "Release channel: $channel"
          echo "Release source: $source_ref"

      - name: Install the locked release and signing toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.7
          experimental: true
          install_args: "go goreleaser syft cosign go:github.com/google/go-licenses/v2"
          cache: false

      - name: Verify source before packaging
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -shuffle=on ./...
          goreleaser check

      - name: Prepare isolated Apple signing credentials
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/corresync-developer-id.p12"
          keychain_path="$RUNNER_TEMP/corresync-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$MACOS_SIGN_P12" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_SIGN_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "Developer ID Application: Naoki Kiyohara ($MACOS_TEAM_ID)"

          xcrun notarytool store-credentials "corresync-release" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --keychain "$keychain_path"
          rm -f "$certificate_path"
          echo "CORRESYNC_KEYCHAIN_PATH=$keychain_path" >>"$GITHUB_ENV"

      - name: Build SBOM-bearing draft release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and notarize every Darwin binary
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: >-
            Developer ID Application: Naoki Kiyohara (${{ secrets.MACOS_TEAM_ID }})
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          notary_root="$RUNNER_TEMP/corresync-notary"
          notary_zip="$RUNNER_TEMP/corresync-notary.zip"
          mkdir -p "$notary_root"

          primary_count="$(
            jq '[.[] | select(.type == "Binary" and .goos == "darwin" and .name == "corr")] | length' \
              dist/artifacts.json
          )"
          compatibility_count="$(
            jq '[.[] | select(.type == "Binary" and .goos == "darwin" and .name == "corresync")] | length' \
              dist/artifacts.json
          )"
          test "$primary_count" -eq 2
          test "$compatibility_count" -eq 2
          jq -r '
            .[]
            | select(.type == "Binary" and .goos == "darwin" and .name == "corr")
            | [.path, .goarch]
            | @tsv
          ' dist/artifacts.json |
            while IFS=$'\t' read -r binary architecture; do
              test -f "$binary"
              mkdir -p "$notary_root/$architecture"
              codesign \
                --force \
                --options runtime \
                --timestamp \
                --keychain "$CORRESYNC_KEYCHAIN_PATH" \
                --sign "$MACOS_SIGN_IDENTITY" \
                "$binary"
              codesign --verify --strict --verbose=2 "$binary"
              codesign --display --verbose=4 "$binary" 2>&1 |
                grep -F "TeamIdentifier=$MACOS_TEAM_ID"
              compatibility_binary="$(
                jq -er --arg architecture "$architecture" '
                  .[]
                  | select(
                      .type == "Binary"
                      and .goos == "darwin"
                      and .goarch == $architecture
                      and .name == "corresync"
                    )
                  | .path
                ' dist/artifacts.json
              )"
              test -f "$compatibility_binary"
              install -m 0755 "$binary" "$compatibility_binary"
              cmp -s "$binary" "$compatibility_binary"
              codesign --verify --strict --verbose=2 "$compatibility_binary"
              install -m 0755 "$binary" "$notary_root/$architecture/corr"
              install -m 0755 "$binary" "$notary_root/$architecture/corresync"
            done

          ditto -c -k --keepParent "$notary_root" "$notary_zip"
          notary_result="$(
            xcrun notarytool submit "$notary_zip" \
              --keychain-profile "corresync-release" \
              --keychain "$CORRESYNC_KEYCHAIN_PATH" \
              --wait \
              --timeout 20m \
              --output-format json
          )"
          printf '%s\n' "$notary_result" |
            jq -e '.status == "Accepted"'
          printf 'Apple notarization accepted: %s\n' \
            "$(printf '%s\n' "$notary_result" | jq -r '.id')"

      - name: Repack signed Darwin archives and refresh their SBOMs
        run: >-
          go run ./tools/macosrelease
          --dist dist

      - name: Build the platform-universal MCP Bundle
        run: go run ./tools/mcpbpack --dist dist

      - name: Render package-catalog manifests
        run: go run ./tools/catalogrender --dist dist

      - name: Verify every release output
        run: go run ./tools/releaseverify --dist dist

      - name: Attach signed macOS assets, MCP Bundle, and registry manifest
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/corresync_*_darwin_*.tar.gz
          dist/corresync_*_darwin_*.tar.gz.spdx.json
          dist/corresync_*_darwin_*.tar.gz.cdx.json
          dist/*.mcpb
          dist/*.mcpb.spdx.json
          dist/*.mcpb.cdx.json
          dist/server.json
          dist/checksums.txt
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve verified package-catalog manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-catalogs-${{ github.ref_name }}
          path: |
            dist/homebrew/Formula/corresync.rb
            dist/scoop/corresync.json
            dist/winget/manifests
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the verified signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signing-input-${{ github.ref_name }}
          path: dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove the isolated Apple signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/corresync-developer-id.p12"
          security delete-keychain "$CORRESYNC_KEYCHAIN_PATH" || true

  sign-release:
    name: Sign and publish verified release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Download only the checksum manifest verified by the build job.
      contents: write # Attach its signature and publish the existing draft.
      id-token: write # Exchange GitHub OIDC for the keyless signing certificate.
    steps:
      - name: Check out the locked signing toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked cosign
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.7
          experimental: true
          install_args: cosign
          cache: false

      - name: Download the verified signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signing-input-${{ github.ref_name }}
          path: dist

      - name: Sign the verified checksum manifest
        run: >-
          cosign sign-blob
          --yes
          --bundle dist/checksums.txt.sigstore.json
          dist/checksums.txt

      - name: Attach signature bundle to the verified draft
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/checksums.txt.sigstore.json
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified release
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    name: Publish and verify MCP Registry record
    if: ${{ !contains(github.ref_name, '-') }}
    needs: sign-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Download only the now-public immutable release assets.
      id-token: write # Exchange GitHub OIDC for the MCP Registry namespace token.
    steps:
      - name: Check out the exact stable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install locked cosign
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.7
          experimental: true
          install_args: cosign
          cache: false

      - name: Download exact assets from the public stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release="$(
            gh release view "$GITHUB_REF_NAME" \
              --json isDraft,isPrerelease,tagName,url
          )"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            '.tagName == $tag and (.isDraft | not) and (.isPrerelease | not)' \
            <<<"$release"

          mkdir assets
          gh release download "$GITHUB_REF_NAME" \
            --dir assets \
            --pattern checksums.txt \
            --pattern checksums.txt.sigstore.json \
            --pattern server.json \
            --pattern "corresync_${version}.mcpb" \
            --pattern "corresync_${version}.mcpb.spdx.json" \
            --pattern "corresync_${version}.mcpb.cdx.json"
          test "$(find assets -maxdepth 1 -type f | wc -l)" -eq 6
          test -z "$(find assets -mindepth 1 -maxdepth 1 ! -type f -print -quit)"

      - name: Verify the signed checksum inventory
        run: |
          cosign verify-blob \
            --bundle assets/checksums.txt.sigstore.json \
            --certificate-identity \
              "https://github.com/nkiyohara/corresync/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            assets/checksums.txt

      - name: Verify the registry manifest, MCPB, and both MCPB SBOMs
        run: |
          go build -trimpath -o "$RUNNER_TEMP/registrypublication" ./tools/registrypublication
          "$RUNNER_TEMP/registrypublication" \
            --assets assets \
            --tag "$GITHUB_REF_NAME"

      - name: Install pinned MCP Registry publisher
        run: |
          publisher_archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          publisher_root="$RUNNER_TEMP/mcp-publisher"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --location \
            --proto-redir '=https' \
            --max-redirs 3 \
            --connect-timeout 10 \
            --max-time 60 \
            --fail-with-body \
            --silent \
            --show-error \
            --output "$publisher_archive" \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz'
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            "$publisher_archive" | sha256sum --check --strict
          mkdir "$publisher_root"
          tar -xzf "$publisher_archive" -C "$publisher_root" mcp-publisher
          install -m 0755 "$publisher_root/mcp-publisher" "$RUNNER_TEMP/mcp-publisher-bin"
          "$RUNNER_TEMP/mcp-publisher-bin" --version 2>&1 |
            grep -F 'mcp-publisher 1.8.1'

      - name: Validate the exact downloaded registry manifest
        run: >-
          "$RUNNER_TEMP/mcp-publisher-bin"
          validate assets/server.json

      - name: Check whether the immutable version already exists
        id: registry_version
        run: |
          state="$(
            "$RUNNER_TEMP/registrypublication" \
              --assets assets \
              --tag "$GITHUB_REF_NAME" \
              --check-existing
          )"
          case "$state" in
            present|absent) ;;
            *) echo "Unexpected registry state: $state" >&2; exit 1 ;;
          esac
          echo "state=$state" >>"$GITHUB_OUTPUT"

      - name: Authenticate with GitHub OIDC and publish
        if: steps.registry_version.outputs.state == 'absent'
        run: |
          "$RUNNER_TEMP/mcp-publisher-bin" login github-oidc
          "$RUNNER_TEMP/mcp-publisher-bin" publish assets/server.json

      - name: Post-verify the production registry and write evidence
        run: |
          "$RUNNER_TEMP/registrypublication" \
            --assets assets \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --evidence evidence/mcp-registry-publication.json \
            --timeout 3m

      - name: Preserve content-free publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-registry-publication-${{ github.ref_name }}
          path: evidence/mcp-registry-publication.json
          if-no-files-found: error
          retention-days: 90

  publish-owned-catalogs:
    name: Publish Homebrew and Scoop catalogs
    if: ${{ !contains(github.ref_name, '-') }}
    needs: sign-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Download the verified catalog artifact from this run.
      contents: read
    steps:
      - name: Download verified package-catalog manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-catalogs-${{ github.ref_name }}
          path: catalogs

      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nkiyohara/homebrew-corresync
          path: repositories/homebrew
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          # The following push requires this repo-scoped deploy key; no later step uploads artifacts.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Publish Homebrew Formula
        run: |
          install -m 0644 \
            catalogs/homebrew/Formula/corresync.rb \
            repositories/homebrew/Formula/corresync.rb
          git -C repositories/homebrew diff --check
          if [[ -z "$(git -C repositories/homebrew status \
            --porcelain=v1 --untracked-files=all -- Formula/corresync.rb)" ]]; then
            echo "Homebrew Formula is already current."
            exit 0
          fi
          git -C repositories/homebrew config user.name "github-actions[bot]"
          git -C repositories/homebrew config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C repositories/homebrew add Formula/corresync.rb
          git -C repositories/homebrew commit -m "chore: update corresync to ${GITHUB_REF_NAME#v}"
          git -C repositories/homebrew push origin HEAD:main

      - name: Check out Scoop bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nkiyohara/scoop-corresync
          path: repositories/scoop
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          # The following push requires this repo-scoped deploy key; no later step uploads artifacts.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Publish Scoop manifest
        run: |
          install -m 0644 \
            catalogs/scoop/corresync.json \
            repositories/scoop/corresync.json
          git -C repositories/scoop diff --check
          if [[ -z "$(git -C repositories/scoop status \
            --porcelain=v1 --untracked-files=all -- corresync.json)" ]]; then
            echo "Scoop manifest is already current."
            exit 0
          fi
          git -C repositories/scoop config user.name "github-actions[bot]"
          git -C repositories/scoop config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C repositories/scoop add corresync.json
          git -C repositories/scoop commit -m "chore: update corresync to ${GITHUB_REF_NAME#v}"
          git -C repositories/scoop push origin HEAD:main

  submit-winget:
    name: Submit WinGet manifest
    if: ${{ !contains(github.ref_name, '-') }}
    needs: sign-release
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read # Download the verified catalog artifact from this run.
      contents: read
    steps:
      - name: Download verified package-catalog manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-catalogs-${{ github.ref_name }}
          path: catalogs

      - name: Guard against duplicate WinGet pull requests
        id: winget_pr_guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_PR_AUTHOR: ${{ vars.WINGET_PR_AUTHOR }}
        run: |
          if ($env:WINGET_PR_AUTHOR -notmatch '\A[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}\z') {
            throw "WINGET_PR_AUTHOR must be a valid GitHub login"
          }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $query = [uri]::EscapeDataString(
            "repo:microsoft/winget-pkgs is:pr is:open author:$env:WINGET_PR_AUTHOR in:title nkiyohara.Corresync"
          )
          $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/search/issues?q=$query&per_page=100"
          $open = @($response.items)
          $sameVersion = @($open | Where-Object {
            $_.title -match [regex]::Escape($version)
          })
          if ($sameVersion.Count -gt 0) {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "WinGet pull request for $version already exists; submission is current."
          } elseif ($open.Count -gt 0) {
            $urls = ($open | ForEach-Object { $_.html_url }) -join ", "
            throw "An earlier WinGet pull request is still open: $urls"
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Set up .NET for WinGetCreate
        if: steps.winget_pr_guard.outputs.skip != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 6.0.428

      - name: Install pinned WinGetCreate
        if: steps.winget_pr_guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/winget-create/releases/download/v1.12.8.0/wingetcreate.exe"
          $expected = "8bd738851b524885410112678e3771b341c5c716de60fbbecb88ab0a363ed85d"
          Invoke-WebRequest $url -OutFile wingetcreate.exe
          $actual = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "WinGetCreate checksum mismatch: $actual"
          }

      - name: Submit verified WinGet manifests
        if: steps.winget_pr_guard.outputs.skip != 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $manifest = Join-Path "catalogs/winget/manifests/n/nkiyohara/Corresync" $version
          ./wingetcreate.exe submit --prtitle "Update nkiyohara.Corresync to $version" --no-open $manifest
