name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate static site
        run: |
          test -s site/index.html
          test -s site/providers.html
          test -s site/safety.html
          test -s site/styles.css
          test -s site/favicon.svg
          test -s site/corresync-mark.svg
          test -s site/robots.txt
          test -s site/sitemap.xml
          for page in index providers safety; do
            grep -Fq '<html lang="en">' "site/${page}.html"
            grep -Fq '<link rel="canonical"' "site/${page}.html"
            grep -Fq 'corresync-mark.svg' "site/${page}.html"
            ! grep -Eiq 'http-equiv=.*refresh|window\.location|location\.(href|replace)' "site/${page}.html"
          done
          grep -Fq 'https://nkiyohara.github.io/corresync/' site/index.html
          grep -Fq 'https://nkiyohara.github.io/corresync/providers.html' site/providers.html
          grep -Fq 'https://nkiyohara.github.io/corresync/safety.html' site/safety.html
          grep -Fq 'corr mcp setup codex' site/index.html
          grep -Fq 'corr mcp setup github-copilot' site/index.html
          grep -Fq 'corr mcp setup gemini-cli' site/index.html
          grep -Fq 'corr mcp setup qwen-code' site/index.html
          grep -Fq 'https://nkiyohara.github.io/corresync/' site/sitemap.xml
          grep -Fq 'https://nkiyohara.github.io/corresync/providers.html' site/sitemap.xml
          grep -Fq 'https://nkiyohara.github.io/corresync/safety.html' site/sitemap.xml
          ! grep -Riq '<script' site --include='*.html'
          test -z "$(find site -type l -print -quit)"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write # Publish the validated artifact to GitHub Pages.
      id-token: write # Authenticate this deployment with GitHub OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
