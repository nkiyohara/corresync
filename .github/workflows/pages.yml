name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Validate static site
        run: |
          test -s site/index.html
          test -s site/getting-started.html
          test -s site/features.html
          test -s site/providers.html
          test -s site/safety.html
          test -s site/privacy.html
          test -s site/terms.html
          test -s site/styles.css
          test -s site/copy.js
          test -s site/install.sh
          test -s site/install.ps1
          test -s site/favicon.ico
          test -s site/favicon.svg
          test -s site/favicon-32x32.png
          test -s site/apple-touch-icon.png
          test -s site/icon-192.png
          test -s site/icon-512.png
          test -s site/site.webmanifest
          test -s site/corresync-mark.svg
          test -s site/social-card.svg
          test -s site/social-card.png
          test -s site/robots.txt
          test -s site/sitemap.xml
          for page in index getting-started features providers safety privacy terms; do
            grep -Fq '<html lang="en">' "site/${page}.html"
            grep -Fq '<link rel="canonical"' "site/${page}.html"
            grep -Fq 'corresync-mark.svg' "site/${page}.html"
            grep -Fq '<link rel="icon" href="favicon.ico" sizes="any">' "site/${page}.html"
            grep -Fq '<link rel="icon" href="favicon.svg" type="image/svg+xml">' "site/${page}.html"
            grep -Fq '<link rel="apple-touch-icon"' "site/${page}.html"
            grep -Fq '<link rel="manifest" href="site.webmanifest">' "site/${page}.html"
            grep -Fq 'https://corresync.org/social-card.png' "site/${page}.html"
            if grep -Eiq 'http-equiv=.*refresh|window\.location|location\.(href|replace)' "site/${page}.html"; then
              exit 1
            fi
            if grep -Eiq 'on(click|load|error|focus|mouseover)=' "site/${page}.html"; then
              exit 1
            fi
          done
          grep -Fq 'https://corresync.org/' site/index.html
          grep -Fq 'https://corresync.org/getting-started.html' site/getting-started.html
          grep -Fq 'https://corresync.org/features.html' site/features.html
          grep -Fq 'https://corresync.org/providers.html' site/providers.html
          grep -Fq 'https://corresync.org/safety.html' site/safety.html
          grep -Fq 'https://corresync.org/privacy.html' site/privacy.html
          grep -Fq 'https://corresync.org/terms.html' site/terms.html
          grep -Fq 'href="privacy.html"' site/index.html
          grep -Fq 'href="terms.html"' site/index.html
          grep -Fq 'https://mail.google.com/' site/privacy.html
          grep -Fq 'Google API Services User Data Policy' site/privacy.html
          grep -Fq 'Apache License, Version 2.0' site/terms.html
          grep -Fq 'curl -LsSf https://corresync.org/install.sh | sh' site/index.html
          grep -Fq 'curl -LsSf https://corresync.org/install.sh | sh' site/getting-started.html
          grep -Fq 'irm https://corresync.org/install.ps1 | iex' site/index.html
          grep -Fq 'irm https://corresync.org/install.ps1 | iex' site/getting-started.html
          grep -Fq 'winget install --id nkiyohara.Corresync --exact' site/getting-started.html
          grep -Fq 'corr mcp setup codex' site/index.html
          grep -Fq 'corr mcp setup claude-code' site/getting-started.html
          grep -Fq 'corr mcp setup github-copilot' site/getting-started.html
          grep -Fq 'corr mcp setup gemini-cli' site/getting-started.html
          grep -Fq 'corr mcp setup qwen-code' site/getting-started.html
          grep -Fq 'corr mcp setup qoder' site/getting-started.html
          grep -Fq 'corr mcp config kimi-code' site/getting-started.html
          grep -Fq 'https://corresync.org/' site/sitemap.xml
          grep -Fq 'https://corresync.org/getting-started.html' site/sitemap.xml
          grep -Fq 'https://corresync.org/features.html' site/sitemap.xml
          grep -Fq 'https://corresync.org/providers.html' site/sitemap.xml
          grep -Fq 'https://corresync.org/safety.html' site/sitemap.xml
          grep -Fq 'https://corresync.org/privacy.html' site/sitemap.xml
          grep -Fq 'https://corresync.org/terms.html' site/sitemap.xml
          test -z "$(grep -Rh '<script[^>]* src=' site --include='*.html' | grep -Fv 'src="copy.js" defer' || true)"
          if grep -Eiq 'fetch\\(|XMLHttpRequest|WebSocket|EventSource' site/copy.js; then
            exit 1
          fi
          test -z "$(find site -type l -print -quit)"
          go run ./tools/siteverify

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write # Publish the validated artifact to GitHub Pages.
      id-token: write # Authenticate this deployment with GitHub OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
