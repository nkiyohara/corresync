name: Bug report
description: Report a reproducible bug using synthetic or content-free data.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security concerns belong in the security reporting channel. Never attach
        a browser profile, capture, provider payload, mailbox/calendar/import
        data, credential reference, runner argument, or authorization.

  - type: input
    id: version
    attributes:
      label: Corresync version
      description: Prefer the reviewed output from `corr feedback --last-error`.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Use synthetic values and content-free errors.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Redact local paths and use example.invalid identities.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains no mailbox, tenant, or session data.
          required: true
        - label: I did not paste raw command, MCP, provider, or monitor output.
          required: true
