name: Compatibility observation
description: Report a content-free opt-in provider compatibility result.
title: "compat: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Use `corr feedback --last-error` where possible. Do not include account
        aliases/IDs/addresses, tenant or endpoint names, item/request IDs,
        subjects, bodies, queries, source paths, screenshots, provider payloads,
        credentials, grants, tokens, helper output, or approval values.

  - type: input
    id: version
    attributes:
      label: Corresync version
      description: Paste the version and commit from `corr version --json`.
      placeholder: vX.Y.Z / 0123456789abcdef
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider route
      options:
        - microsoft-owa
        - google
        - microsoft-graph
        - jmap
        - imap-smtp
        - caldav
    validations:
      required: true

  - type: input
    id: auth-runtime
    attributes:
      label: Authentication runtime
      description: Browser or OS credential-store/helper family and version only.
      placeholder: Chromium 140 or macOS Keychain 15
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      label: Broad deployment class
      description: Provider plan/class only; no tenant, domain, server, or address.
      placeholder: Microsoft 365 work/school or consumer JMAP
    validations:
      required: true

  - type: textarea
    id: observation
    attributes:
      label: Content-free observation
      description: Name the operation/capability and generalized success/failure stage.
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Reviewed feedback report
      description: Optional output from `corr feedback --last-error`; review before pasting.
      render: json

  - type: checkboxes
    id: confirmation
    attributes:
      label: Safety confirmation
      options:
        - label: I was authorized to access the tested account and device.
          required: true
        - label: I reviewed this report and removed private data and authorization material.
          required: true
        - label: I did not paste raw CLI, MCP, provider, import, event, or monitor output.
          required: true
