name: Policy or licensing question
description: Ask about Corresync privacy, terms, Google data use, or open-source licensing.
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for questions that can be discussed publicly. Never
        include an address, message, calendar event, account or object ID,
        provider response, credential reference, OAuth grant, token, private
        path, or other personal data. Use private vulnerability reporting for a
        security or privacy concern that requires confidential details.

  - type: dropdown
    id: area
    attributes:
      label: Policy area
      options:
        - Privacy Policy and Google user data
        - Terms of Use
        - Apache-2.0 or third-party licensing
        - Documentation or another policy question
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask with synthetic examples and public references only.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included credentials, private correspondence, account data, or personal information.
          required: true
