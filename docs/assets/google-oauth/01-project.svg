<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Google Cloud project picker</title>
  <desc id="desc">Illustrative browser screen showing the project picker and New Project button.</desc>
  <rect width="1120" height="620" rx="24" fill="#edf3fb"/>
  <rect x="36" y="32" width="1048" height="556" rx="18" fill="#fff" stroke="#b9c6d8" stroke-width="2"/>
  <rect x="36" y="32" width="1048" height="64" rx="18" fill="#f8fafc"/>
