<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Google API Library</title>
  <desc id="desc">Illustrative browser screen showing Gmail, Calendar, and Tasks APIs to enable.</desc>
  <rect width="1120" height="620" rx="24" fill="#edf3fb"/><rect x="36" y="32" width="1048" height="556" rx="18" fill="#fff" stroke="#b9c6d8" stroke-width="2"/>
  <rect x="36" y="32" width="1048" height="64" rx="18" fill="#f8fafc"/><circle cx="72" cy="64" r="8" fill="#ea4335"/><circle cx="98" cy="64" r="8" fill="#fbbc04"/><circle cx="124" cy="64" r="8" fill="#34a853"/>
  <rect x="172" y="48" width="760" height="32" rx="16" fill="#e9eef5"/><text x="190" y="69" font-family="system-ui,sans-serif" font-size="15" fill="#5f6b7a">console.cloud.google.com/apis/library</text>
  <rect x="36" y="96" width="220" height="492" fill="#f8fafc"/><text x="68" y="140" font-family="system-ui,sans-serif" font-weight="700" font-size="18" fill="#243143">APIs &amp; Services</text><text x="68" y="184" font-family="system-ui,sans-serif" font-size="16" fill="#174ea6">Library</text><text x="68" y="222" font-family="system-ui,sans-serif" font-size="16" fill="#5f6b7a">Enabled APIs</text>
  <text x="300" y="144" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#243143">API Library</text>
  <rect x="300" y="172" width="720" height="48" rx="9" fill="#fff" stroke="#4285f4" stroke-width="2"/><text x="326" y="203" font-family="system-ui,sans-serif" font-size="17" fill="#677386">Search for APIs &amp; Services</text>
  <g font-family="system-ui,sans-serif"><rect x="300" y="256" width="220" height="150" rx="12" fill="#fff" stroke="#c9d2df"/><text x="326" y="300" font-size="19" font-weight="700" fill="#243143">Gmail API</text><text x="326" y="334" font-size="15" fill="#677386">For Mail</text><rect x="326" y="354" width="90" height="34" rx="7" fill="#1a73e8"/><text x="343" y="377" font-size="14" font-weight="700" fill="#fff">ENABLE</text>
  <rect x="550" y="256" width="220" height="150" rx="12" fill="#fff" stroke="#c9d2df"/><text x="576" y="300" font-size="19" font-weight="700" fill="#243143">Calendar API</text><text x="576" y="334" font-size="15" fill="#677386">Calendar + Meet links</text><rect x="576" y="354" width="90" height="34" rx="7" fill="#1a73e8"/><text x="593" y="377" font-size="14" font-weight="700" fill="#fff">ENABLE</text>
  <rect x="800" y="256" width="220" height="150" rx="12" fill="#fff" stroke="#c9d2df"/><text x="826" y="300" font-size="19" font-weight="700" fill="#243143">Tasks API</text><text x="826" y="334" font-size="15" fill="#677386">Only if selected</text><rect x="826" y="354" width="90" height="34" rx="7" fill="#1a73e8"/><text x="843" y="377" font-size="14" font-weight="700" fill="#fff">ENABLE</text></g>
  <rect x="300" y="446" width="720" height="58" rx="9" fill="#fff7e0"/><text x="326" y="480" font-family="system-ui,sans-serif" font-size="16" fill="#6f4c00">Enable only services you selected in Corresync.</text>
  <text x="560" y="558" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#677386">Illustrative screen — Google may change labels</text>
</svg>
