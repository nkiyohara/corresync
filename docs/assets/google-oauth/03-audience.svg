<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Google Auth Platform audience and data access</title>
  <desc id="desc">Illustrative browser screen highlighting Audience, Test users, and Data Access.</desc>
  <rect width="1120" height="620" rx="24" fill="#edf3fb"/><rect x="36" y="32" width="1048" height="556" rx="18" fill="#fff" stroke="#b9c6d8" stroke-width="2"/>
  <rect x="36" y="32" width="1048" height="64" rx="18" fill="#f8fafc"/><circle cx="72" cy="64" r="8" fill="#ea4335"/><circle cx="98" cy="64" r="8" fill="#fbbc04"/><circle cx="124" cy="64" r="8" fill="#34a853"/><rect x="172" y="48" width="760" height="32" rx="16" fill="#e9eef5"/><text x="190" y="69" font-family="system-ui,sans-serif" font-size="15" fill="#5f6b7a">console.cloud.google.com/auth/audience</text>
  <rect x="36" y="96" width="250" height="492" fill="#f8fafc"/><text x="68" y="140" font-family="system-ui,sans-serif" font-weight="700" font-size="18" fill="#243143">Google Auth Platform</text><text x="68" y="184" font-family="system-ui,sans-serif" font-size="16" fill="#5f6b7a">Branding</text><rect x="56" y="202" width="210" height="42" rx="7" fill="#e8f0fe"/><text x="68" y="229" font-family="system-ui,sans-serif" font-size="16" fill="#174ea6">Audience</text><text x="68" y="276" font-family="system-ui,sans-serif" font-size="16" fill="#5f6b7a">Clients</text><text x="68" y="318" font-family="system-ui,sans-serif" font-size="16" fill="#5f6b7a">Data Access</text>
  <text x="330" y="150" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#243143">Audience</text><text x="330" y="190" font-family="system-ui,sans-serif" font-size="17" fill="#5f6b7a">Choose Internal only for an eligible single organization.</text>
  <rect x="330" y="220" width="330" height="84" rx="10" fill="#fff" stroke="#4285f4" stroke-width="2"/><circle cx="360" cy="252" r="9" fill="#1a73e8"/><text x="386" y="258" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#243143">External</text><text x="386" y="282" font-family="system-ui,sans-serif" font-size="14" fill="#677386">Personal accounts and other audiences</text>
