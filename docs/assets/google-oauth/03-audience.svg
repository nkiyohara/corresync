  <rect x="330" y="340" width="690" height="116" rx="10" fill="#f8fafc" stroke="#c9d2df"/><text x="354" y="378" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#243143">Test users</text><text x="354" y="410" font-family="system-ui,sans-serif" font-size="15" fill="#677386">Add every account while publishing status is Testing.</text><rect x="854" y="366" width="132" height="42" rx="7" fill="#1a73e8"/><text x="878" y="393" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">ADD USERS</text>
