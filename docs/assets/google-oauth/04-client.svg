<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Create and download a Google Desktop OAuth client</title>
  <desc id="desc">Illustrative browser screen selecting Desktop app and downloading its JSON.</desc>
  <rect width="1120" height="620" rx="24" fill="#edf3fb"/><rect x="36" y="32" width="1048" height="556" rx="18" fill="#fff" stroke="#b9c6d8" stroke-width="2"/>
  <rect x="36" y="32" width="1048" height="64" rx="18" fill="#f8fafc"/><circle cx="72" cy="64" r="8" fill="#ea4335"/><circle cx="98" cy="64" r="8" fill="#fbbc04"/><circle cx="124" cy="64" r="8" fill="#34a853"/><rect x="172" y="48" width="760" height="32" rx="16" fill="#e9eef5"/><text x="190" y="69" font-family="system-ui,sans-serif" font-size="15" fill="#5f6b7a">console.cloud.google.com/auth/clients</text>
  <text x="82" y="146" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#243143">Create OAuth client</text><text x="82" y="190" font-family="system-ui,sans-serif" font-size="16" fill="#5f6b7a">Application type</text>
  <rect x="82" y="208" width="430" height="54" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/><text x="106" y="242" font-family="system-ui,sans-serif" font-size="18" fill="#243143">Desktop app ▾</text>
  <rect x="82" y="298" width="430" height="54" rx="8" fill="#fff" stroke="#c9d2df"/><text x="106" y="332" font-family="system-ui,sans-serif" font-size="18" fill="#243143">My Corresync</text>
  <rect x="82" y="390" width="126" height="46" rx="8" fill="#1a73e8"/><text x="111" y="420" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">CREATE</text>
  <path d="M552 235 H610" stroke="#d13b4c" stroke-width="4"/><path d="M552 235 l14 -10 v20 z" fill="#d13b4c"/><text x="624" y="230" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#9b2433">Desktop app only</text><text x="624" y="256" font-family="system-ui,sans-serif" font-size="15" fill="#677386">No Web application or service account</text>
  <rect x="620" y="298" width="390" height="158" rx="12" fill="#f8fafc" stroke="#c9d2df"/><text x="648" y="338" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#243143">OAuth client created</text><text x="648" y="372" font-family="system-ui,sans-serif" font-size="15" fill="#677386">Download once, then import locally.</text><rect x="648" y="396" width="210" height="40" rx="7" fill="#1a73e8"/><text x="674" y="422" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">DOWNLOAD JSON</text>
  <text x="560" y="558" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#677386">Illustrative screen — keep the downloaded JSON private</text>
</svg>
