version: "3"

set: [errexit, nounset, pipefail]

vars:
  BINARY: bin/corr
  CLAUDE_CODE_VERSION: 2.1.224
  SKILLS_REF_SOURCE: >-
    git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref

tasks:
  default:
    desc: Show available development tasks
    cmds:
      - task --list

  setup:
    desc: Install the pinned toolchain and automatic commit-time formatting
    cmds:
      - mise install
      - mise exec -- prek install --prepare-hooks

  format:
    desc: Format Go, shell, and structured project files
    cmds:
      - gofmt -w $(rg --files -g '*.go' -g '!vendor/**')
      - shfmt -w -i 2 -ci mcpb/server/launch.sh site/install.sh tools/test-install.sh
      - dprint fmt

  format:check:
    desc: Verify Go, shell, and structured project file formatting
    cmds:
      - test -z "$(gofmt -l $(rg --files -g '*.go' -g '!vendor/**'))"
      - shfmt -d -i 2 -ci mcpb/server/launch.sh site/install.sh tools/test-install.sh
      - dprint check

  hooks:install:
    desc: Install the repository-managed commit hooks
    cmds:
      - prek install --prepare-hooks

  hooks:run:
    desc: Run every repository-managed commit hook
    cmds:
      - prek run --all-files

  docs:
    desc: Lint Markdown documentation
    cmds:
      - markdownlint-cli2 "**/*.md" "#.git" "#.release" "#dist" "#vendor"

  site:
    desc: Verify Pages metadata, structured data, links, assets, and sitemap
    cmds:
      - go run ./tools/siteverify

  discovery:generate:
    desc: Generate the public credential-free discovery catalog
    cmds:
      - go run ./tools/discoverycatalog

  discovery:check:
    desc: Verify the public discovery catalog and Worker/browser contracts
    cmds:
      - go run ./tools/discoverycatalog --check
      - node --check web/discovery-worker/src/worker.mjs
      - node --check site/check.js
      - node --test web/discovery-worker/test/*.test.mjs site/check.test.cjs

  integrations:generate:
    desc: Generate agent-host metadata, native bundles, and publication Pages
    cmds:
      - go run ./tools/agenthostcatalog
      - go run ./tools/integrationbundle
      - go run ./tools/publicationsite

  integrations:check:
    desc: Verify agent-host metadata, native bundles, publication Pages, and the portable Skill
    cmds:
      - go run ./tools/agenthostcatalog --check
      - go run ./tools/integrationbundle --check
      - go run ./tools/publicationsite --check
      - uvx --from '{{.SKILLS_REF_SOURCE}}' skills-ref validate plugins/corresync/skills/corresync
      - >-
        npx --yes @anthropic-ai/claude-code@{{.CLAUDE_CODE_VERSION}}
        plugin validate plugins/corresync --strict

  vet:
    desc: Run the Go static analyzer
    cmds:
      - go vet ./...

  lint:
    desc: Run the configured Go and shell linters
    cmds:
      - golangci-lint run
      - shellcheck mcpb/server/launch.sh site/install.sh tools/test-install.sh

  test:
    desc: Run deterministic unit and contract tests
    cmds:
      - go test -shuffle=on -coverprofile=coverage.out ./...
      - ./tools/test-install.sh

  race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  vuln:
    desc: Check dependencies for known reachable vulnerabilities
    cmds:
      - govulncheck ./...

  licenses:
    desc: Check licenses of dependencies linked into the release binary
    cmds:
      # go-licenses cannot associate these nested package layouts with their
      # module-root Apache-2.0 LICENSE files. Module content remains go.sum
      # pinned; every other linked dependency remains checked below.
      - >-
        go-licenses check ./cmd/corr
        --ignore github.com/nkiyohara/corresync
        --ignore github.com/cyberphone/json-canonicalization
        --ignore github.com/in-toto/attestation
        --ignore github.com/in-toto/in-toto-golang

  secrets:
    desc: Scan repository history and the working tree for committed secrets
    cmds:
      - gitleaks git --redact --no-banner .
      - gitleaks dir --redact --no-banner .

  build:
    desc: Build the local CLI
    cmds:
      - mkdir -p bin
      - go build -trimpath -o {{.BINARY}} ./cmd/corr

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build all release archives and SBOMs without publishing
    cmds:
      - goreleaser release --snapshot --clean
      - go run ./tools/mcpbpack --dist dist
      - go run ./tools/catalogrender --dist dist
      - go run ./tools/releaseverify --dist dist

  actions:
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint
      - zizmor --pedantic .github/workflows

  verify:
    desc: Run every local quality gate
    cmds:
      - task: format:check
      - task: docs
      - task: site
      - task: discovery:check
      - task: integrations:check
      - task: vet
      - task: lint
      - task: test
      - task: race
      - task: secrets
      - task: vuln
      - task: licenses
      - task: build
      - task: release:check
      - task: actions
