version: 2

project_name: corresync

before:
  hooks:
    - go mod vendor
    - >-
        go-licenses check ./cmd/corr
        --ignore github.com/nkiyohara/corresync
    - >-
        go-licenses save ./cmd/corr
        --ignore github.com/nkiyohara/corresync
        --save_path .release/third_party_licenses
        --force
    - >-
        go run ./tools/normalizefiles
        --root .release/third_party_licenses
        --time {{ .CommitDate }}
    - >-
        go build -trimpath
        -ldflags=-X=main.releaseTimestamp={{ .CommitDate }}
        -o .release/syft-reproducible
        ./tools/syftreproducible

builds:
  - id: corr
    main: ./cmd/corr
    binary: corr
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - >-
        -s -w -buildid=
        -X github.com/nkiyohara/corresync/internal/buildinfo.version={{ .Version }}
        -X github.com/nkiyohara/corresync/internal/buildinfo.commit={{ .Commit }}
        -X github.com/nkiyohara/corresync/internal/buildinfo.buildDate={{ .CommitDate }}
  # Keep one finite compatibility entry in v0.8-v0.9. It is built from the
  # exact same package and flags as corr so neither surface can drift.
  - id: corresync-compat
    main: ./cmd/corr
    binary: corresync
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - >-
        -s -w -buildid=
        -X github.com/nkiyohara/corresync/internal/buildinfo.version={{ .Version }}
        -X github.com/nkiyohara/corresync/internal/buildinfo.commit={{ .Commit }}
        -X github.com/nkiyohara/corresync/internal/buildinfo.buildDate={{ .CommitDate }}

archives:
  - id: release
    ids:
      - corr
      - corresync-compat
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    builds_info:
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: SECURITY.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: docs/install.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: docs/mcp.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: plugins/corresync/README.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: plugins/corresync/**/*
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .agents/plugins/marketplace.json
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .claude-plugin/marketplace.json
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/corr.bash
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/_corr
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/corr.fish
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: manpages/corr.1
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .release/third_party_licenses/**/*
        dst: third_party_licenses
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"

nfpms:
  - id: linux-packages
    ids:
      - corr
      - corresync-compat
    package_name: corresync
    # GitHub rewrites '~' in release asset names, which otherwise makes the
    # checksum manifest unverifiable for prerelease deb and RPM packages.
    file_name_template: '{{ replace .ConventionalFileName "~" "_" }}'
    vendor: Corresync contributors
    homepage: https://github.com/nkiyohara/corresync
    maintainer: Corresync maintainers <nkiyohara@users.noreply.github.com>
    description: >-
      Local-first guarded mail and calendar CLI, session owner, and MCP server.
    license: Apache-2.0
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    section: utils
    priority: optional
    release: "1"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/corresync/LICENSE
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/corresync/README.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        dst: /usr/share/doc/corresync/CHANGELOG.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/corr.bash
        dst: /usr/share/bash-completion/completions/corr
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/_corr
        dst: /usr/share/zsh/site-functions/_corr
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/corr.fish
        dst: /usr/share/fish/vendor_completions.d/corr.fish
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: manpages/corr.1
        dst: /usr/share/man/man1/corr.1
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: plugins/corresync/
        dst: /usr/share/corresync/plugins/corresync
        type: tree
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .agents/plugins/marketplace.json
        dst: /usr/share/corresync/.agents/plugins/marketplace.json
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .claude-plugin/marketplace.json
        dst: /usr/share/corresync/.claude-plugin/marketplace.json
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .release/third_party_licenses/
        dst: /usr/share/doc/corresync/third_party_licenses
        type: tree
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"
  files:
    - src: vendor/modules.txt
      info:
        mode: 0644
        mtime: "{{ .CommitDate }}"
    - src: vendor/**/*
      info:
        mode: 0644
        mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: source-spdx
    artifacts: source
    cmd: ../.release/syft-reproducible
    documents:
      - "${artifact}.spdx.json"
    args:
      - "${artifact}"
      - --output
      - "spdx-json=${document}"
      - --enrich
      - all
  - id: source-cyclonedx
    artifacts: source
    cmd: ../.release/syft-reproducible
    documents:
      - "${artifact}.cdx.json"
    args:
      - "${artifact}"
      - --output
      - "cyclonedx-json=${document}"
      - --enrich
      - all
  - id: spdx
    artifacts: archive
    ids:
      - release
    cmd: ../.release/syft-reproducible
    documents:
      - "${artifact}.spdx.json"
    args:
      - "${artifact}"
      - --output
      - "spdx-json=${document}"
      - --enrich
      - all
  - id: cyclonedx
    artifacts: archive
    ids:
      - release
    cmd: ../.release/syft-reproducible
    documents:
      - "${artifact}.cdx.json"
    args:
      - "${artifact}"
      - --output
      - "cyclonedx-json=${document}"
      - --enrich
      - all
  - id: package-spdx
    artifacts: package
    ids:
      - linux-packages
    cmd: ../.release/syft-reproducible
    documents:
      - "${artifact}.spdx.json"
    args:
      - "${artifact}"
      - --output
      - "spdx-json=${document}"
      - --enrich
      - all
  - id: package-cyclonedx
    artifacts: package
    ids:
      - linux-packages
    cmd: ../.release/syft-reproducible
    documents:
      - "${artifact}.cdx.json"
    args:
      - "${artifact}"
      - --output
      - "cyclonedx-json=${document}"
      - --enrich
      - all

changelog:
  use: git
  sort: asc

release:
  draft: true
  replace_existing_draft: false
  prerelease: auto
  make_latest: false
  name_template: "corresync {{ .Tag }}"
  header: |
    Local-first Outlook Web mail and calendar for humans, scripts, and AI
    agents. Verify the checksum and review the compatibility notes before using
    this build with an authorized mailbox.
